<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - cellxgene VIP Gateway</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { min-height: 100vh; display: flex; align-items: center; background: #121212; }
.login-card { max-width: 400px; width: 100%; }
</style>
</head>
<body>
<div class="container d-flex justify-content-center">
  <div class="login-card">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">
          <i class="bi bi-shield-lock me-2"></i>Gateway Login
        </h3>
        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <span id="loginSpinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  const spinner = document.getElementById('loginSpinner');
  const alert = document.getElementById('errorAlert');
  alert.classList.add('d-none');
  btn.disabled = true;
  spinner.classList.remove('d-none');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.ok) {
      window.location.href = '/filecrawl';
    } else {
      alert.textContent = data.error || 'Login failed';
      alert.classList.remove('d-none');
    }
  } catch (err) {
    alert.textContent = 'Network error';
    alert.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    spinner.classList.add('d-none');
  }
});
</script>
</body>
</html>
