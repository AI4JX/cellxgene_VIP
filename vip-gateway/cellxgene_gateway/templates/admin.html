<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - cellxgene VIP Gateway</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark border-bottom border-secondary px-3">
  <span class="navbar-brand mb-0 h1">
    <i class="bi bi-gear me-2"></i>Admin Panel
  </span>
  <div>
    <span class="text-light me-3"><i class="bi bi-person-circle me-1"></i>{{ username }}</span>
    <a href="/filecrawl" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-grid me-1"></i>Datasets</a>
    <button id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
  </div>
</nav>

<div class="container-fluid py-4">
  <div class="row">
    <div class="col-12">
      <div class="card shadow mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 class="mb-0"><i class="bi bi-people me-2"></i>Users</h5>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">
            <i class="bi bi-plus-lg me-1"></i>Add User
          </button>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-dark table-striped mb-0" id="userTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th>Created</th>
                  <th>Dataset Permissions</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <tr><td colspan="6" class="text-center py-4"><div class="spinner-border" role="status"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark">
      <div class="modal-header">
        <h5 class="modal-title">Add User</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="addUserAlert" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" id="newUsername">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="newPassword">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="saveUserBtn">Create User</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit Permissions Modal -->
<div class="modal fade" id="permsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content bg-dark">
      <div class="modal-header">
        <h5 class="modal-title">Dataset Permissions for <span id="permsUsername"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Select folders that this user can access. If none selected, the user sees all datasets.</p>
        <div id="permsCheckboxList" class="row g-2"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="savePermsBtn">Save Permissions</button>
      </div>
    </div>
  </div>
</div>

<!-- Set Password Modal -->
<div class="modal fade" id="passwordModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark">
      <div class="modal-header">
        <h5 class="modal-title">Set Password for <span id="passwordUsername"></span></h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="passwordAlert" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" id="newPasswordInput">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="savePasswordBtn">Set Password</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentUserId = null;

async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: {'Content-Type': 'application/json', ...opts.headers},
    ...opts
  });
  if (res.status === 401) { window.location.href = '/login'; return null; }
  if (res.status === 403) { window.location.href = '/filecrawl'; return null; }
  return res.json();
}

async function loadUsers() {
  const data = await api('/api/admin/users');
  if (!data) return;
  const tbody = document.getElementById('userTableBody');
  tbody.innerHTML = data.users.map(u => `
    <tr>
      <td>${u.id}</td>
      <td><i class="bi bi-person me-1"></i>${u.username}</td>
      <td>${u.is_admin ? '<span class="badge bg-danger">Admin</span>' : '<span class="badge bg-secondary">User</span>'}</td>
      <td>${u.created_at || '-'}</td>
      <td>
        <button class="btn btn-outline-info btn-sm perms-btn" data-user-id="${u.id}" data-username="${u.username}">
          <i class="bi bi-eye me-1"></i>Permissions
        </button>
      </td>
      <td>
        <button class="btn btn-outline-warning btn-sm password-btn" data-user-id="${u.id}" data-username="${u.username}">
          <i class="bi bi-key me-1"></i>Password
        </button>
        ${!u.is_admin ? `<button class="btn btn-outline-danger btn-sm delete-btn" data-user-id="${u.id}" data-username="${u.username}">
          <i class="bi bi-trash me-1"></i>Delete
        </button>` : ''}
      </td>
    </tr>
  `).join('');
}

async function loadFolders() {
  const data = await api('/api/datasets');
  if (!data) return [];
  const folders = new Set();
  data.forEach(ds => folders.add(ds.subfolder || ''));
  return [...folders].sort();
}

document.getElementById('userTableBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;

  if (btn.classList.contains('delete-btn')) {
    const uid = parseInt(btn.dataset.userId);
    const uname = btn.dataset.username;
    if (!confirm(`Delete user "${uname}"?`)) return;
    const data = await api(`/api/admin/users/${uid}`, {method: 'DELETE'});
    if (data && data.ok) loadUsers();
  }

  if (btn.classList.contains('password-btn')) {
    currentUserId = parseInt(btn.dataset.userId);
    document.getElementById('passwordUsername').textContent = btn.dataset.username;
    document.getElementById('newPasswordInput').value = '';
    document.getElementById('passwordAlert').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('passwordModal')).show();
  }

  if (btn.classList.contains('perms-btn')) {
    currentUserId = parseInt(btn.dataset.userId);
    document.getElementById('permsUsername').textContent = btn.dataset.username;
    const [userPerms, allFolders] = await Promise.all([
      api(`/api/admin/users/${currentUserId}/permissions`),
      loadFolders()
    ]);
    const list = document.getElementById('permsCheckboxList');
    if (allFolders.length === 0) {
      list.innerHTML = '<p class="text-muted">No folders found. Create folders in the Datasets page first.</p>';
    } else {
      const allowed = userPerms?.folders || [];
      list.innerHTML = allFolders.map(f => `
        <div class="col-md-6">
          <div class="form-check">
            <input class="form-check-input perms-checkbox" type="checkbox" value="${f}" id="perm_${f.replace(/[^a-zA-Z0-9_]/g, '_')}"
              ${allowed.includes(f) ? 'checked' : ''}>
            <label class="form-check-label" for="perm_${f.replace(/[^a-zA-Z0-9_]/g, '_')}">
              ${f || '<em>root</em>'}
            </label>
          </div>
        </div>
      `).join('');
    }
    new bootstrap.Modal(document.getElementById('permsModal')).show();
  }
});

document.getElementById('saveUserBtn').addEventListener('click', async () => {
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const alert = document.getElementById('addUserAlert');
  if (!username || !password) {
    alert.textContent = 'Username and password required';
    alert.classList.remove('d-none');
    return;
  }
  const data = await api('/api/admin/users', {
    method: 'POST',
    body: JSON.stringify({username, password})
  });
  if (data && data.ok) {
    bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    alert.classList.add('d-none');
    loadUsers();
  } else {
    alert.textContent = data?.error || 'Failed to create user';
    alert.classList.remove('d-none');
  }
});

document.getElementById('savePasswordBtn').addEventListener('click', async () => {
  const password = document.getElementById('newPasswordInput').value;
  const alert = document.getElementById('passwordAlert');
  if (!password) {
    alert.textContent = 'Password required';
    alert.classList.remove('d-none');
    return;
  }
  const data = await api(`/api/admin/users/${currentUserId}/password`, {
    method: 'PUT',
    body: JSON.stringify({password})
  });
  if (data && data.ok) {
    bootstrap.Modal.getInstance(document.getElementById('passwordModal')).hide();
  } else {
    alert.textContent = data?.error || 'Failed to set password';
    alert.classList.remove('d-none');
  }
});

document.getElementById('savePermsBtn').addEventListener('click', async () => {
  const checkboxes = document.querySelectorAll('.perms-checkbox:checked');
  const folders = [...checkboxes].map(cb => cb.value);
  const data = await api(`/api/admin/users/${currentUserId}/permissions`, {
    method: 'PUT',
    body: JSON.stringify({folders})
  });
  if (data && data.ok) {
    bootstrap.Modal.getInstance(document.getElementById('permsModal')).hide();
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await api('/api/logout', {method: 'POST'});
  window.location.href = '/login';
});

loadUsers();
</script>
</body>
</html>
